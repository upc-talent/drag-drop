:root{
  --navy:#223974; --orange:#F8991D; --blue:#188CCD; --teal:#00A99B; --who:#8EA3F2;
  --ink:#F4F7FF; --ink-2:rgba(236,242,255,.78); --ink-3:rgba(226,234,255,.56);
  --card-ink:#17275A; --card-ink-2:#5B6A92;
  --ok:#16A34A; --ok-bg:#E7F8EE; --bad:#DC2626; --bad-bg:#FDECEC;
  --glass:linear-gradient(140deg,rgba(255,255,255,.15),rgba(255,255,255,.06));
  --glass-border:rgba(255,255,255,.2);
  --radius:22px; --tray-h:0px;
  --font:'Bw','NotoAr',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);background:#0d1738;min-height:100vh;min-height:100dvh;line-height:1.5;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
svg.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── Background ── */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
  radial-gradient(1200px 800px at 85% -10%,#2b4a9b 0%,transparent 60%),
  radial-gradient(900px 700px at -10% 110%,#0d5f78 0%,transparent 60%),
  linear-gradient(160deg,#1a2b62 0%,#121d45 45%,#0b1433 100%)}
.blob{position:absolute;border-radius:50%;opacity:.55;will-change:transform}
.b1{width:46vmax;height:46vmax;top:-14vmax;inset-inline-start:-12vmax;background:radial-gradient(circle at 40% 40%,rgba(0,169,155,.75),rgba(0,169,155,0) 65%);animation:drift1 26s ease-in-out infinite alternate}
.b2{width:40vmax;height:40vmax;bottom:-16vmax;inset-inline-end:-10vmax;background:radial-gradient(circle at 50% 50%,rgba(248,153,29,.55),rgba(248,153,29,0) 65%);animation:drift2 30s ease-in-out infinite alternate}
.b3{width:36vmax;height:36vmax;top:30%;inset-inline-end:20%;background:radial-gradient(circle at 50% 50%,rgba(24,140,205,.55),rgba(24,140,205,0) 65%);animation:drift3 34s ease-in-out infinite alternate}
.grain{position:absolute;inset:0;opacity:.06;background-image:radial-gradient(rgba(255,255,255,.8) 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay}
@keyframes drift1{to{transform:translate(8vmax,6vmax) scale(1.08)}}
@keyframes drift2{to{transform:translate(-7vmax,-5vmax) scale(1.1)}}
@keyframes drift3{to{transform:translate(-6vmax,7vmax) scale(.92)}}

.glass{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);
  -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);
  box-shadow:0 18px 50px rgba(4,10,35,.35),inset 0 1px 0 rgba(255,255,255,.22)}

/* ── Top bar ── */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(13,23,56,.72),rgba(13,23,56,.35));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:34px;width:auto;display:block}
.brand .sep{width:1px;height:26px;background:rgba(255,255,255,.22)}
.brand .tag{font-size:13px;color:var(--ink-2);white-space:nowrap;font-weight:500}
.tb-actions{display:flex;gap:8px;align-items:center}
.pill-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:500;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);transition:background .2s}
.pill-btn:hover{background:rgba(255,255,255,.18)}
.pill-btn:focus-visible,.btn:focus-visible,.card:focus-visible,.zone:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* ── Buttons & inputs ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border-radius:14px;font-weight:700;font-size:16px;
  transition:transform .15s var(--ease),box-shadow .2s,opacity .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{color:#1b1406;background:linear-gradient(135deg,#FFB547,#F8991D 55%,#EE8410);box-shadow:0 10px 26px rgba(248,153,29,.38),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-primary:disabled{opacity:.42;box-shadow:none;cursor:not-allowed;filter:saturate(.4)}
.btn-ghost{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.btn-ghost:hover{background:rgba(255,255,255,.17)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#c81e1e);color:#fff;box-shadow:0 8px 22px rgba(220,38,38,.35)}
.btn-sm{padding:8px 12px;font-size:13.5px;border-radius:10px;font-weight:500}
.btn .spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:block;margin-top:18px}
.field span{display:block;font-size:14px;color:var(--ink-2);margin-bottom:8px;font-weight:500}
.input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(8,16,44,.35);color:#fff;font-size:17px;outline:none;transition:border .2s,background .2s}
.input::placeholder{color:rgba(255,255,255,.4)}
.input:focus{border-color:rgba(248,153,29,.85);background:rgba(8,16,44,.5)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* ── Sign-in / login ── */
.center{min-height:calc(100dvh - 70px);display:grid;place-items:center;padding:24px 16px 40px}
.panel{width:100%;max-width:520px;padding:32px 28px;animation:rise .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.04em;color:#ffd59a;background:rgba(248,153,29,.14);border:1px solid rgba(248,153,29,.35);padding:5px 12px;border-radius:999px}
.hero-title{font-family:'NotoAr',var(--font);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.25;margin:16px 0 4px;direction:rtl;text-align:start}
html[dir=ltr] .hero-title{text-align:left}
.role{color:var(--ink-2);font-size:15px}
.q-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0 6px}
.q-chip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);position:relative;overflow:hidden}
.q-chip::before{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--c)}
.q-chip .ic{color:var(--c)}
.q-chip b{font-family:'NotoAr',var(--font);font-size:17px}
.q-chip small{font-size:10.5px;letter-spacing:.12em;color:var(--ink-3);font-weight:700}
.steps{list-style:none;margin:18px 0 4px;display:grid;gap:10px}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink-2)}
.steps li .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:rgba(255,255,255,.14);color:#fff}
.panel .btn-primary{width:100%;margin-top:22px}
.setup-note{margin-top:16px;padding:12px 14px;border-radius:12px;background:rgba(248,153,29,.14);border:1px solid rgba(248,153,29,.4);font-size:13.5px;color:#ffe2b8}

/* ── Play layout ── */
.play{display:grid;gap:18px;padding:18px max(18px,env(safe-area-inset-right)) 28px max(18px,env(safe-area-inset-left));max-width:1480px;margin:0 auto;grid-template-columns:350px minmax(0,1fr);align-items:start}
.board-wrap{display:flex;flex-direction:column;gap:16px;min-width:0}
.board-head{display:flex;align-items:center;gap:14px;padding:14px 18px;flex-wrap:wrap}
.team-chip{display:flex;align-items:center;gap:10px;min-width:0}
.team-chip .av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--blue));flex:none;box-shadow:0 6px 16px rgba(0,169,155,.35)}
.team-chip .meta{min-width:0}
.team-chip .meta small{display:block;font-size:12px;color:var(--ink-3)}
.team-chip .meta b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.head-role{font-size:13.5px;color:var(--ink-2);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08)}
.progress{margin-inline-start:auto;display:flex;align-items:center;gap:12px;min-width:200px}
.progress .bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.progress .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--blue));transition:width .45s var(--ease)}
html[dir=rtl] .progress .bar i{margin-left:auto;background:linear-gradient(270deg,var(--teal),var(--blue))}
.progress span{font-size:13.5px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);color:var(--ink-2)}
.icon-btn:hover{background:rgba(255,255,255,.16);color:#fff}

.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.zone{--c:var(--teal);--c-rgb:0,169,155;position:relative;padding:16px;border-radius:var(--radius);
  background:linear-gradient(165deg,rgba(var(--c-rgb),.24),rgba(255,255,255,.05) 55%);border:1px solid rgba(var(--c-rgb),.45);
  -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);
  box-shadow:0 18px 50px rgba(4,10,35,.3),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .25s var(--ease),box-shadow .25s,border-color .25s;outline:none}
.zone[data-drop=WHAT]{--c:var(--teal);--c-rgb:0,169,155}
.zone[data-drop=HOW]{--c:var(--blue);--c-rgb:24,140,205}
.zone[data-drop=WHY]{--c:var(--orange);--c-rgb:248,153,29}
.zone[data-drop=WHO]{--c:var(--who);--c-rgb:142,163,242}
.zone-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.zone-head .badge{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(var(--c-rgb),.28);color:var(--c);border:1px solid rgba(var(--c-rgb),.55);flex:none}
.zone-head .badge svg{width:22px;height:22px}
.zone-head .ttl b{display:block;font-family:'NotoAr',var(--font);font-size:23px;line-height:1.15}
.zone-head .ttl small{display:block;font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--ink-3);margin-top:2px}

/* ── Tray ── */

.card .fix{flex-basis:100%;display:flex;align-items:center;gap:7px;margin-top:3px;padding-top:7px;border-top:1px dashed rgba(220,38,38,.35);font-size:13px;font-weight:700;color:#0f7a3a;font-family:'NotoAr',var(--font)}

.card{flex-wrap:wrap}
.card .txt{min-width:0}

.card.ok{background:linear-gradient(180deg,#F2FCF6,var(--ok-bg));border-inline-start-color:var(--ok)!important;box-shadow:0 0 0 2px rgba(22,163,74,.55),0 6px 18px rgba(4,10,35,.2)}

.admin{max-width:1280px;margin:0 auto;padding:20px max(18px,env(safe-area-inset-right)) 48px max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}

.tbl{padding:6px 6px}
.tr{display:grid;grid-template-columns:minmax(140px,1.3fr) 100px 140px 100px minmax(380px,2.4fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:14px}
.tr+.tr{border-top:1px solid rgba(255,255,255,.07)}

.t-name{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.score{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-family:'Bw',sans-serif}

.score .mini{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;min-width:44px}

.dots{display:flex;flex-wrap:wrap;gap:4px}

};

/* ── API ── */
const apiReady = () => /^https:\/\//.test(API_URL);
async function api(action, payload){
  if (!apiReady()) throw {code:'NO_API'};
  const ctrl = ('AbortController' in window) ? new AbortController() : null;
  const tm = setTimeout(() => ctrl && ctrl.abort(), 25000);
  let data;
  try {
    const res = await fetch(API_URL, {method:'POST', body:JSON.stringify(Object.assign({action}, payload || {})), redirect:'follow', signal: ctrl ? ctrl.signal : undefined});
    data = await res.json();
  } catch(e){ throw {code:'NETWORK'}; }
  finally { clearTimeout(tm); }
  if (!data || !data.ok) throw {code:(data && data.error) || 'SERVER'};
  return data;
}

/* ── Small UI helpers ── */
function toast(msg, err){
  const el = document.createElement('div'); el.className = 'toast' + (err ? ' err' : ''); el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3700);
}
function busy(btn, on){
  if (!btn) return;
  if (on){ btn.dataset.html = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true; }
  else if (btn.dataset.html){ btn.innerHTML = btn.dataset.html; delete btn.dataset.html; btn.disabled = false; }
}
function modal(o){
  return new Promise(resolve => {
    const scrim = document.createElement('div'); scrim.className = 'scrim';
    scrim.innerHTML = `<div class="dialog glass" role="dialog" aria-modal="true"><h3>${esc(o.title)}</h3>${o.body ? `<p>${esc(o.body)}</p>` : ''}
      ${o.input != null ? `<input class="input" style="margin-top:14px" maxlength="30" dir="auto" value="${esc(o.input)}">` : ''}
      <div class="acts2">${o.cancel ? `<button class="btn btn-ghost" data-r="0" type="button">${esc(o.cancel)}</button>` : ''}
      <button class="btn ${o.danger ? 'btn-danger' : 'btn-primary'}" data-r="1" type="button">${esc(o.ok)}</button></div></div>`;
    document.body.appendChild(scrim);
    const inp = scrim.querySelector('input');
    const close = r => { scrim.remove(); document.removeEventListener('keydown', onKey); resolve(r); };
    const onKey = e => { if (e.key === 'Escape') close(false); if (e.key === 'Enter' && inp) close(inp.value); };
    document.addEventListener('keydown', onKey);
    scrim.addEventListener('click', e => {
      if (e.target === scrim) return close(false);
      const b = e.target.closest('[data-r]'); if (!b) return;
      close(b.dataset.r === '1' ? (inp ? inp.value : true) : false);
    });
    setTimeout(() => (inp || scrim.querySelector('[data-r="1"]')).focus(), 30);
    if (inp) inp.select();
  });
}
function fmtTime(iso){
  if (!iso) return '—';

  return d.toLocaleTimeString(LANG === 'ar' ? 'ar-EG' : 'en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let P = null;          // {run, teamId, team, order, placements, seq, seqN, submitted, result, already}
let SEL = null;        // selected card id (tap mode)
let LANDED = null;     // last placed card id (for animation)
let VIEW = 'mine';     // results view: 'mine' (our answers) | 'correct' (corrected board)
let RP = 0;            // reveal-poll timer
const saveP = () => P ? store.set(SKEY, P) : store.del(SKEY);

function freshState(r){
  VIEW = 'mine';
  return {run:r.run, teamId:r.teamId, team:r.team, order:shuffle(CARDS.map(c => c.id)), placements:{}, seq:{}, seqN:0, submitted:false, result:null, already:false};
}
function placedCount(){ return P ? CARDS.filter(c => P.placements[c.id]).length : 0; }

async function startParticipant(){
  const s = store.get(SKEY);
  if (s && s.teamId){
    P = s; show('vPlay'); renderPlay();
    try { applyServer(await api('status', {teamId:P.teamId, run:P.run})); }
    catch(e){ handleErr(e); }
  } else {
    show('vSignin');
    $('#setupNote').hidden = apiReady();
  }
}

function applyServer(r){
  P.team = r.team || P.team;
  if (r.status === 'submitted' && r.result){
    const wasSubmitted = P.submitted, wasRevealed = !!(P.result && P.result.revealed);
    P.submitted = true; P.result = r.result;
    if (!r.result.revealed) VIEW = 'mine';
    if (wasSubmitted && !wasRevealed && r.result.revealed) toast(t('revealedToast'));
    if (r.result.placements) P.placements = Object.assign({}, r.result.placements);
    saveP(); renderPlay(!wasSubmitted);
  } else if (P.submitted){
    P = freshState(P); saveP(); renderPlay(); toast(t('reopened'));
  } else { saveP(); renderPlay(); }
}

function handleErr(e){
  const code = e && e.code;
  if (code === 'RUN_CHANGED' || code === 'TEAM_NOT_FOUND'){
    clearTimeout(RP); RP = 0; VIEW = 'mine';
    P = null; saveP(); show('vSignin'); toast(t(code === 'RUN_CHANGED' ? 'runChanged' : 'teamRemoved'), true);
  } else if (code === 'NO_API') toast(t('noApi'), true);
  else if (code === 'INCOMPLETE') toast(t('incomplete'), true);
  else if (code === 'BAD_NAME') toast(t('errName'), true);
  else toast(t('errNet'), true);
}

$('#signinForm').addEventListener('submit', async e => {
  e.preventDefault();
  const inp = $('#teamInput'), btn = $('#startBtn');
  const name = inp.value.replace(/\s+/g, ' ').trim();
  if (!name){ inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); toast(t('errName'), true); inp.focus(); return; }
  busy(btn, true);
  try {
    const r = await api('join', {team:name});
    if (r.status === 'submitted'){
      P = freshState(r); P.already = true; show('vPlay'); applyServer(r);
    } else {
      if (!r.isNew){
        busy(btn, false);
        const ok = await modal({title:t('takenT'), body:t('takenB', {name:r.team}), ok:t('continueTeam'), cancel:t('otherName')});

$('#leaveBtn').addEventListener('click', async () => {

function cardHTML(id, zone){
  let cls = 'card', mark = '';
  let extra = '';
  if (P.submitted && P.result && zone){
    const ok = P.result.perCard && P.result.perCard[id];
    const corr = P.result.correct && P.result.correct[id];
    if (VIEW === 'correct' && corr){
      cls += ' fixed';
      mark = `<span class="mark" aria-label="${t('lgFixed')}">${ICONS.move}</span>`;
      extra = fixTag('youChose', P.placements[id]);
    } else {
      cls += ok ? ' ok' : ' bad';
      mark = `<span class="mark" aria-label="${ok ? t('lgOk') : t('lgBad')}">${ok ? ICONS.check : ICONS.x}</span>`;
      if (!ok && corr) extra = fixTag('correctIs', corr);
    }
  }
  if (SEL === id) cls += ' selected';
  if (LANDED === id) cls += ' landed';
  const n = '#' + id.slice(1);
  return `<div class="${cls}" data-id="${id}" tabindex="${P.submitted ? -1 : 0}" role="button" aria-label="${n} ${esc(cardText(id))}"><span class="num">${n}</span><span class="txt" dir="rtl">${esc(cardText(id))}</span>${mark}${extra}</div>`;
}
function zoneLabel(zid){ const z = zoneOf(zid); return z ? `<bdi dir="rtl">${z.ar}</bdi> ${z.en}` : esc(zid); }
function fixTag(key, zid){ const z = zoneOf(zid); return `<span class="fix" style="--zc:${z ? z.c : '#16A34A'}"><i></i>${t(key, {q:zoneLabel(zid)})}</span>`; }
// Which question a card sits under on the board (the corrected board moves wrong cards to their right question)
function boardZone(id){ return (P.submitted && VIEW === 'correct' && P.result && P.result.correct && P.result.correct[id]) || P.placements[id]; }

function renderPlay(animateResult){
  if (!P) return;
  const placed = placedCount(), done = P.submitted;
  document.body.classList.toggle('is-results', !!done);
  $('#teamName').textContent = P.team;
  $('#progText').textContent = t('placed', {n:placed, t:N});
  $('#progBar').style.width = (placed / N * 100) + '%';
  $('#leftCount').textContent = t('left', {n:N - placed});
  $('#leaveBtn').hidden = false;

  // board
  let idx = 0;
  $('#board').innerHTML = ZONES.map(z => {
    const ids = CARDS.map(c => c.id).filter(id => boardZone(id) === z.id).sort((a, b) => (P.seq[a] || 0) - (P.seq[b] || 0));
    const cards = ids.map(id => cardHTML(id, z.id)).join('');
    const label = `${z.ar} ${z.en}`;
    return `<div class="zone${SEL && !done ? ' targetable' : ''}" data-drop="${z.id}" tabindex="${done ? -1 : 0}" role="group" aria-label="${label}">
      <div class="zone-head"><span class="badge">${ICONS[z.id]}</span><div class="ttl"><b dir="rtl">${z.ar}</b><small>${z.en}</small></div><span class="cnt">${ids.length}</span></div>
      <div class="zone-body">${cards || `<div class="hint">${ICONS.drop}<span>${t('dropHere')}</span></div>`}</div></div>`;
  }).join('');

  // tray
  const left = P.order.filter(id => !P.placements[id]);
  $('#trayList').innerHTML = left.length ? left.map(id => cardHTML(id, null)).join('')
    : `<div class="tray-empty"><span class="ok-ic">${ICONS.check}</span><span>${t('allPlaced')}</span></div>`;
  $('#tray').classList.toggle('targetable', !!(SEL && P.placements[SEL]));
  const canSubmit = placed === N && !done;
  $('#submitBtn').disabled = !canSubmit; $('#submitBtnM').disabled = !canSubmit;

  // results
  $('#resultBanner').hidden = !done;
  if (done && P.result){
    const sc = P.result.score, tot = P.result.total || N;
    $('#scoreTot').textContent = '/ ' + tot;
    $('#resTitle').textContent = sc === tot ? t('perfect') : t('scoreT');
    $('#resSub').textContent = t('resSub', {ok:sc, bad:tot - sc});
    $('#alreadyNote').hidden = !P.already;
    const rev = !!P.result.revealed, hasFix = rev && P.result.correct && Object.keys(P.result.correct).length > 0;
    $('#waitNote').hidden = rev;
    $('#viewToggle').hidden = !hasFix;
    $('#viewToggle').textContent = t(VIEW === 'correct' ? 'showMine' : 'showCorrect');
    $('#lgFixed').hidden = !(hasFix && VIEW === 'correct');
    if (!RP) startRevealPoll();
    const ring = $('#ringVal'), C = 263.9;
    if (animateResult){
      ring.style.transition = 'none'; ring.style.strokeDashoffset = C; void ring.getBoundingClientRect();
      ring.style.transition = ''; requestAnimationFrame(() => { ring.style.strokeDashoffset = C * (1 - sc / tot); });
      countUp($('#scoreNum'), sc);
      document.querySelectorAll('#board .card').forEach((el, i) => { el.style.animationDelay = (i * 55) + 'ms'; el.classList.add('reveal'); });
      if (sc === tot) setTimeout(confetti, 600);
      window.scrollTo({top:0, behavior:'smooth'});
    } else { ring.style.strokeDashoffset = C * (1 - sc / tot); $('#scoreNum').textContent = sc; }
  }
  LANDED = null;
  updateTrayH();
}
/* After submitting, team screens poll cheaply until the trainer reveals (or hides) the answers */
function startRevealPoll(){
  clearTimeout(RP); RP = 0;
  if (!P || !P.submitted || !apiReady()) return;
  RP = setTimeout(pollReveal, (P.result && P.result.revealed) ? 15000 : 5000);
}
async function pollReveal(){
  RP = 0;
  if (!P || !P.submitted || $('#vPlay').hidden) return;
  if (document.hidden){ startRevealPoll(); return; }
  try {
    const r = await api('ping', {run:P.run});
    if (r.runChanged){ handleErr({code:'RUN_CHANGED'}); return; }
    if (P && r.revealed !== !!(P.result && P.result.revealed)) applyServer(await api('status', {teamId:P.teamId, run:P.run}));
  } catch(e){ if (e && (e.code === 'RUN_CHANGED' || e.code === 'TEAM_NOT_FOUND')){ handleErr(e); return; } }
  startRevealPoll();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && P && P.submitted && !RP) startRevealPoll(); });

/* Slide cards between "our answers" and "correct board" (FLIP animation) */
function flipBoard(change){
  const before = {};
  document.querySelectorAll('#board .card').forEach(el => { before[el.dataset.id] = el.getBoundingClientRect(); });
  change();
  document.querySelectorAll('#board .card').forEach(el => {
    const a = before[el.dataset.id]; if (!a || !el.animate) return;
    const b = el.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    el.style.zIndex = 5; el.style.position = 'relative';
    el.animate([{transform:`translate(${dx}px,${dy}px) scale(1.04)`, boxShadow:'0 24px 50px rgba(4,10,35,.45)'}, {transform:'none'}], {duration:750, easing:'cubic-bezier(.2,.8,.2,1)'})
      .onfinish = () => { el.style.zIndex = ''; el.style.position = ''; };
  });
}
$('#viewToggle').addEventListener('click', () => flipBoard(() => { VIEW = VIEW === 'correct' ? 'mine' : 'correct'; renderPlay(); }));

function countUp(el, to){
  const t0 = performance.now(), d = 1100;
  const step = now => { const p = Math.min(1, (now - t0) / d); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function confetti(){
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#00A99B','#188CCD','#F8991D','#ffffff','#8EA3F2'];
  for (let i = 0; i < 70; i++){
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw'; p.style.background = cols[i % cols.length];
    p.style.setProperty('--dx', (Math.random() * 30 - 15) + 'vw'); p.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
    p.style.animationDuration = (2.2 + Math.random() * 1.8) + 's'; p.style.animationDelay = (Math.random() * .5) + 's';
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 5000);
}

function place(id, zone){
  if (!P || P.submitted) return;
  if (zone){ if (P.placements[id] === zone) return; P.placements[id] = zone; P.seq[id] = ++P.seqN; }
  else { if (!P.placements[id]) return; delete P.placements[id]; delete P.seq[id]; }
  LANDED = id; SEL = null; vibrate(12); saveP(); renderPlay();
}

/* ── Submit ── */
async function doSubmit(btn){
  if (!P || P.submitted || placedCount() < N) return;
  const ok = await modal({title:t('confirmT'), body:t('confirmB'), ok:t('yesSubmit'), cancel:t('cancel')});
  if (!ok) return;
  busy(btn, true);
  try {
    const r = await api('submit', {teamId:P.teamId, run:P.run, placements:P.placements});
    P.already = !!r.alreadySubmitted; SEL = null;
    busy(btn, false);
    applyServer(r);
  } catch(e){ busy(btn, false); handleErr(e); renderPlay(); }
}
$('#submitBtn').addEventListener('click', e => doSubmit(e.currentTarget));
$('#submitBtnM').addEventListener('click', e => doSubmit(e.currentTarget));

/* ── Tap / keyboard selection ── */
function selectCard(id){
  SEL = SEL === id ? null : id;
  document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
  if (SEL){ const el = document.querySelector(`.card[data-id="${SEL}"]`); el && el.classList.add('selected'); }
  document.querySelectorAll('.zone').forEach(z => z.classList.toggle('targetable', !!SEL));
  $('#tray').classList.toggle('targetable', !!(SEL && P.placements[SEL]));
}
document.addEventListener('click', e => {
  if (!P || P.submitted || !SEL || $('#vPlay').hidden) return;
  if (e.target.closest('.card') || e.target.closest('button')) return;
  const target = e.target.closest('[data-drop]');
  if (target) place(SEL, target.dataset.drop === 'tray' ? null : target.dataset.drop);
  else selectCard(SEL); // tap outside → deselect
});
document.addEventListener('keydown', e => {
  if (!P || P.submitted || $('#vPlay').hidden) return;
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest && e.target.closest('.card');
  if (card){ e.preventDefault(); selectCard(card.dataset.id); return; }
  const zone = e.target.closest && e.target.closest('.zone');
  if (zone && SEL){ e.preventDefault(); const id = SEL; place(id, zone.dataset.drop);
    const el = document.querySelector(`.card[data-id="${id}"]`); el && el.focus(); }
});

/* ── Pointer drag & drop (mouse, touch, pen — Android & iOS) ── */
let D = null;
document.addEventListener('pointerdown', e => {
  if (!P || P.submitted || $('#vPlay').hidden || D) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const card = e.target.closest('.card'); if (!card) return;
  const r = card.getBoundingClientRect();
  D = {id:card.dataset.id, el:card, pid:e.pointerId, x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, ox:e.clientX - r.left, oy:e.clientY - r.top, w:r.width, moved:false, ghost:null, over:null, raf:0};
});
document.addEventListener('pointermove', e => {
  if (!D || e.pointerId !== D.pid) return;
  D.x = e.clientX; D.y = e.clientY;
  if (!D.moved){
    const dx = Math.abs(D.x - D.x0), dy = Math.abs(D.y - D.y0);
    if (Math.hypot(dx, dy) < 7) return;
    // Touch inside the tray: a swipe along the tray scrolls it; only a swipe towards the board drags the card.
    if (e.pointerType !== 'mouse' && D.el.closest('#trayList')){
      const docked = getComputedStyle($('#tray')).position === 'fixed';
      if (docked ? dx > dy : dy > dx){ D = null; return; }
    }
    startDrag();
  }
  if (e.cancelable) e.preventDefault();
  moveGhost(); hoverAt();
}, {passive:false});
document.addEventListener('pointerup', e => {
  if (!D || e.pointerId !== D.pid) return;
  const d = D;
  if (!d.moved){ D = null; selectCard(d.id); return; }
  const target = d.over; endDrag();
  if (target) place(d.id, target === 'tray' ? null : target);
});
document.addEventListener('pointercancel', e => { if (D && e.pointerId === D.pid){ if (D.moved) endDrag(); D = null; } });
// iOS: stop the page from scrolling while a card is being dragged
document.addEventListener('touchmove', e => { if (D && D.moved && e.cancelable) e.preventDefault(); }, {passive:false});

function startDrag(){
  D.moved = true;
  if (SEL) selectCard(SEL);
  const g = D.el.cloneNode(true);
  g.classList.add('ghost'); g.classList.remove('selected', 'landed', 'reveal');
  g.style.width = D.w + 'px';
  // keep the zone accent on the ghost
  const zoneEl = D.el.closest('.zone');
  if (zoneEl) g.style.borderInlineStart = '4px solid ' + getComputedStyle(zoneEl).getPropertyValue('--c');
  document.body.appendChild(g);
  D.ghost = g; D.el.classList.add('src'); document.body.classList.add('dragging');
  document.querySelectorAll('.zone').forEach(z => z.classList.remove('targetable'));
  vibrate(8);
  const loop = () => { if (!D || !D.moved) return; autoScroll(); D.raf = requestAnimationFrame(loop); };
  D.raf = requestAnimationFrame(loop);
}
function moveGhost(){ if (D.ghost) D.ghost.style.transform = `translate3d(${D.x - D.ox}px,${D.y - D.oy}px,0) rotate(-1.5deg) scale(1.03)`; }
function hoverAt(){
  const el = document.elementFromPoint(D.x, D.y);
  const tgt = el && el.closest('[data-drop]');
  const id = tgt ? tgt.dataset.drop : null;
  if (id === D.over) return;
  document.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
  if (tgt) tgt.classList.add('over');
  D.over = id;
}
function autoScroll(){
  const docked = getComputedStyle($('#tray')).position === 'fixed';
  const bottomEdge = docked ? $('#tray').getBoundingClientRect().top : window.innerHeight;
  const topEdge = $('.topbar').getBoundingClientRect().bottom;
  let v = 0;
  if (D.y < topEdge + 70) v = -Math.ceil((topEdge + 70 - D.y) / 5);
  else if (D.y > bottomEdge - 70 && D.y < bottomEdge + 4) v = Math.ceil((D.y - (bottomEdge - 70)) / 5);
  if (v){ window.scrollBy(0, Math.max(-22, Math.min(22, v))); hoverAt(); }
}
function endDrag(){
  cancelAnimationFrame(D.raf);
  D.ghost && D.ghost.remove();
  D.el.classList.remove('src');
  document.body.classList.remove('dragging');
  document.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
  D = null;
}

/* tray height → bottom padding on tablets & phones */
function updateTrayH(){
  const tray = $('#tray');
  const docked = !$('#vPlay').hidden && !document.body.classList.contains('is-results') && getComputedStyle(tray).position === 'fixed';
  document.documentElement.style.setProperty('--tray-h', docked ? tray.offsetHeight + 'px' : '0px');
}
if ('ResizeObserver' in window) new ResizeObserver(updateTrayH).observe($('#tray'));
window.addEventListener('resize', updateTrayH);

function renderAdmin(){

  $('#tabTeams').hidden = A.tab !== 'teams'; $('#tabCards').hidden = A.tab !== 'cards';

  const top = subs.length ? Math.max.apply(null, subs.map(x => x.score)) : null;
  const topTeams = subs.filter(x => x.score === top).map(x => x.team);

  $('#kpis').innerHTML = [
    `<div class="kpi glass"><small>${t('kTeams')}</small><b>${teams.length}</b><div class="foot">${t('kPlaying', {n:teams.length - subs.length})}</div></div>`,
    `<div class="kpi glass"><small>${t('kSub')}</small><b>${subs.length}</b><div class="foot">${t('kOfJoined', {n:teams.length})}</div></div>`,
    `<div class="kpi glass"><small>${t('kAvg')}</small><b>${avg == null ? '—' : (Math.round(avg * 10) / 10)}<em> / ${tot}</em></b><div class="foot">&nbsp;</div></div>`,

  ].join('');

  // Teams tab
  teams.sort((a, b) => {
    if (a.status !== b.status) return a.status === 'submitted' ? -1 : 1;
    if (a.status === 'submitted') return (b.score - a.score) || (new Date(a.submittedAt) - new Date(b.submittedAt));

  });
  if (!teams.length) $('#tabTeams').innerHTML = `<div class="tbl glass"><div class="empty">${t('noTeams')}</div></div>`;
  else {

    $('#tabTeams').innerHTML = `<div class="tbl glass"><div class="tr th"><div>${t('thTeam')}</div><div>${t('thStatus')}</div><div>${t('thScore')}</div><div class="t-time">${t('thTime')}</div><div>${t('thCards')}</div><div></div></div>` +

          </div></div>`;
      }).join('') + '</div>';
  }

  // Card analysis tab
  if (!subs.length){ $('#tabCards').innerHTML = `<div class="glass"><div class="empty">${t('noSubs')}</div></div>`; return; }
  const stats = d.key.map(k => {
    const wrong = {}; let ok = 0;
    subs.forEach(x => { const p = x.placements[k.id]; if (p === k.zone) ok++; else if (p) wrong[p] = (wrong[p] || 0) + 1; });
    const mw = Object.keys(wrong).sort((a, b) => wrong[b] - wrong[a])[0];
    return {k, ok, pct:ok / subs.length, mw, mwN:mw ? wrong[mw] : 0};
  });
  const qacc = ZONES.map(z => {
    const s = stats.filter(x => x.k.zone === z.id);
    const okSum = s.reduce((a, x) => a + x.ok, 0), all = s.length * subs.length;
    return {z, pct:all ? okSum / all : 0, cards:s.length};
  });
  stats.sort((a, b) => a.pct - b.pct || a.k.id.localeCompare(b.k.id));
  $('#tabCards').innerHTML = `<h3 class="sec-title">${t('byQ')}</h3><div class="qacc">` +
    qacc.map(q => `<div class="kpi glass" style="--c:${q.z.c}"><div class="qh"><span class="ic">${ICONS[q.z.id]}</span><b dir="rtl">${q.z.ar}</b><small style="margin:0;color:var(--ink-3);letter-spacing:.1em;font-weight:700;font-size:11px">${q.z.en}</small></div><b>${Math.round(q.pct * 100)}%</b><div class="foot">${t('correctPl')}</div></div>`).join('') +
    `</div><h3 class="sec-title" style="margin-top:22px">${t('byCard')}</h3><div class="cards-an glass">` +
    stats.map(s => {
      const z = zoneOf(s.k.zone) || {ar:s.k.zone, en:s.k.zone, c:'#fff'};
      const mwz = s.mw ? zoneOf(s.mw) : null;
      return `<div class="ca"><span class="cid">#${s.k.id.slice(1)}</span><span class="ctext" dir="rtl">${esc(s.k.text || cardText(s.k.id))}</span>
        <span class="cq"><span class="qtag" style="--c:${z.c}"><i></i><bdi dir="rtl">${z.ar}</bdi> ${z.en}</span></span>
        <div class="pct"><div class="row"><span>${t('pctOk', {n:s.ok, t:subs.length})}</span><b>${Math.round(s.pct * 100)}%</b></div><div class="bar"><i style="width:${s.pct * 100}%"></i></div>
        <div class="mw">${mwz ? t('mostWrong', {q:'<bdi dir="rtl">' + mwz.ar + '</bdi> ' + mwz.en, n:s.mwN}) : t('noMistakes')}</div></div></div>`;
    }).join('') + '</div>';
}

document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { A.tab = b.dataset.tab; renderAdmin(); }));
$('#runSel').addEventListener('change', e => { const n = +e.target.value; A.run = (A.data && n === A.data.currentRun) ? null : n; refresh(); });
$('#revealBtn').addEventListener('click', async e => {
  if (!A.data) return;
  const on = !A.data.revealed;
  if (on){
    const playing = A.data.teams.filter(x => x.status !== 'submitted').length;
    const body = t('revealB') + (playing ? ' ' + t('revealPlaying', {n:playing}) : '');
    if (!await modal({title:t('revealT'), body, ok:t('reveal'), cancel:t('cancel')})) return;
  }
  const btn = e.currentTarget; busy(btn, true);
  try { await api('reveal', {pw:A.pw, on}); A.data.revealed = on; toast(t('done')); }
  catch(err){ handleAdminErr(err); }
  finally { busy(btn, false); renderAdmin(); refresh(); }
});
$('#resetAllBtn').addEventListener('click', async e => {
  const ok = await modal({title:t('resetAllT'), body:t('resetAllB'), ok:t('resetAll'), cancel:t('cancel'), danger:true});
  if (!ok) return;
  const btn = e.currentTarget; busy(btn, true);
  try { await api('resetAll', {pw:A.pw}); A.run = null; toast(t('done')); await refresh(); } catch(err){ handleAdminErr(err); }
  finally { busy(btn, false); }
});
$('#tabTeams').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.closest('[data-team]').dataset.team;
  const team = A.data.teams.find(x => x.id === id); if (!team) return;
  const act = b.dataset.act;
  let payload = {pw:A.pw, teamId:id}, action;
  if (act === 'rename'){
    const v = await modal({title:t('renameT'), input:team.team, ok:t('save'), cancel:t('cancel')});
    if (v === false || !String(v).trim() || String(v).trim() === team.team) return;
    action = 'renameTeam'; payload.name = String(v).trim();
  } else if (act === 'reopen'){
    if (!await modal({title:t('reopenT', {name:team.team}), body:t('reopenB'), ok:t('confirm'), cancel:t('cancel')})) return;
    action = 'resetTeam';
  } else if (act === 'delete'){
    if (!await modal({title:t('delT', {name:team.team}), body:t('delB'), ok:t('del'), cancel:t('cancel'), danger:true})) return;
    action = 'deleteTeam';
  }
  busy(b, true);
  try { await api(action, payload); toast(t('done')); await refresh(); } catch(err){ handleAdminErr(err); }
  finally { busy(b, false); }
});

/* ═════════════════════ BOOT ═════════════════════ */
function route(){
  clearTimeout(A.timer);
  if (/^#\/?admin/i.test(location.hash)) startAdmin(); else startParticipant();
}
LANG = store.get(LKEY) || 'ar';
applyLang();
window.addEventListener('hashchange', route);
route();
</script>
</body>
